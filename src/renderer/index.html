<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;"
    />
    <title>screen-buddy</title>
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/theme-neon.css" />
  </head>
  <body data-theme="neon">
    <div class="hud" id="hud">
      <!-- ── header ─────────────────────────────────────────────── -->
      <header class="hud__header">
        <div class="ident">
          <span class="ident__mark">SCREEN·BUDDY</span>
          <span class="ident__host" id="host">—</span>
          <span class="ident__os" id="os"></span>
        </div>
        <div class="header__right">
          <div class="uptime">
            <span class="label">UPTIME</span>
            <span class="uptime__value" id="uptime">—</span>
          </div>
          <div class="clock">
            <span class="clock__time" id="clock">--:--</span>
            <span class="clock__secs" id="clock-secs"></span>
          </div>
        </div>
      </header>

      <!-- ── gauges + core heatmap ───────────────────────────────── -->
      <section class="hud__gauges" id="panel-gauges">
        <article class="gauge" id="gauge-cpu">
          <div class="gauge__dial">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="arc arc--track" cx="60" cy="60" r="50" />
              <circle class="arc arc--value" cx="60" cy="60" r="50" />
              <circle class="arc arc--glow" cx="60" cy="60" r="50" />
            </svg>
            <div class="gauge__readout">
              <span class="gauge__value" data-field="temp">--</span>
              <span class="gauge__unit">°C</span>
            </div>
          </div>
          <div class="gauge__meta">
            <h2 class="gauge__title">CPU</h2>
            <p class="gauge__sub" data-field="name">—</p>
            <dl class="statlist">
              <div><dt>LOAD</dt><dd data-field="load">--</dd></div>
              <div><dt>CLOCK</dt><dd data-field="clock">--</dd></div>
              <div><dt>POWER</dt><dd data-field="power">--</dd></div>
              <div><dt>FAN</dt><dd data-field="fan">--</dd></div>
            </dl>
          </div>
        </article>

        <article class="gauge" id="gauge-gpu">
          <div class="gauge__dial">
            <svg viewBox="0 0 120 120" aria-hidden="true">
              <circle class="arc arc--track" cx="60" cy="60" r="50" />
              <circle class="arc arc--value" cx="60" cy="60" r="50" />
              <circle class="arc arc--glow" cx="60" cy="60" r="50" />
            </svg>
            <div class="gauge__readout">
              <span class="gauge__value" data-field="temp">--</span>
              <span class="gauge__unit">°C</span>
            </div>
          </div>
          <div class="gauge__meta">
            <h2 class="gauge__title">GPU</h2>
            <p class="gauge__sub" data-field="name">—</p>
            <dl class="statlist">
              <div><dt>LOAD</dt><dd data-field="load">--</dd></div>
              <div><dt>CLOCK</dt><dd data-field="clock">--</dd></div>
              <div><dt>POWER</dt><dd data-field="power">--</dd></div>
              <div><dt>FAN</dt><dd data-field="fan">--</dd></div>
            </dl>
          </div>
        </article>

        <article class="cores" id="panel-cores">
          <h2 class="cores__title">
            THREADS <span class="cores__count" id="cores-count"></span>
          </h2>
          <div class="cores__grid" id="cores-grid"></div>
          <p class="cores__legend">
            <span class="cores__swatch cores__swatch--low"></span> idle
            <span class="cores__swatch cores__swatch--mid"></span> busy
            <span class="cores__swatch cores__swatch--high"></span> saturated
          </p>
        </article>
      </section>

      <!-- ── meters ─────────────────────────────────────────────── -->
      <section class="hud__meters" id="panel-meters">
        <div class="meter" data-meter="cpu">
          <div class="meter__head">
            <span class="meter__label">CPU LOAD</span>
            <span class="meter__value" data-field="value">--</span>
          </div>
          <div class="meter__track"><i class="meter__fill"></i></div>
        </div>
        <div class="meter" data-meter="gpu">
          <div class="meter__head">
            <span class="meter__label">GPU LOAD</span>
            <span class="meter__value" data-field="value">--</span>
          </div>
          <div class="meter__track"><i class="meter__fill"></i></div>
        </div>
        <div class="meter" data-meter="mem">
          <div class="meter__head">
            <span class="meter__label">MEMORY</span>
            <span class="meter__value" data-field="value">--</span>
          </div>
          <div class="meter__track"><i class="meter__fill"></i></div>
        </div>
        <div class="meter" data-meter="vram">
          <div class="meter__head">
            <span class="meter__label">VRAM</span>
            <span class="meter__value" data-field="value">--</span>
          </div>
          <div class="meter__track"><i class="meter__fill"></i></div>
        </div>
      </section>

      <!-- ── network ────────────────────────────────────────────── -->
      <section class="hud__net" id="panel-network">
        <div class="net__head">
          <h2 class="net__title">NETWORK</h2>
          <span class="net__iface" id="net-iface"></span>
          <!--
            Identity here is carried by position (down = above the axis,
            up = below) and by the direct labels, not by hue alone.
          -->
          <span class="net__reading net__reading--rx">
            <span class="net__arrow">↓</span>
            <span class="net__num" id="net-rx">--</span>
            <span class="net__unit" id="net-rx-unit"></span>
          </span>
          <span class="net__reading net__reading--tx">
            <span class="net__arrow">↑</span>
            <span class="net__num" id="net-tx">--</span>
            <span class="net__unit" id="net-tx-unit"></span>
          </span>
        </div>
        <svg
          class="net__plot"
          id="net-plot"
          viewBox="0 0 480 96"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <!-- Half-peak hairlines, so an idle link reads as an empty scale
               rather than a broken panel. Solid, one shade off the surface. -->
          <line class="net__grid" x1="0" y1="25" x2="480" y2="25" />
          <line class="net__grid" x1="0" y1="71" x2="480" y2="71" />
          <line class="net__axis" x1="0" y1="48" x2="480" y2="48" />
          <path class="net__area net__area--rx" id="net-area-rx" />
          <path class="net__line net__line--rx" id="net-line-rx" />
          <path class="net__area net__area--tx" id="net-area-tx" />
          <path class="net__line net__line--tx" id="net-line-tx" />
        </svg>
        <div class="net__scale">
          <span class="label">PEAK</span>
          <span id="net-peak">--</span>
          <span class="net__window" id="net-window"></span>
        </div>
      </section>

      <!-- ── footer ─────────────────────────────────────────────── -->
      <footer class="hud__footer" id="panel-footer">
        <div class="sources" id="sources"></div>
        <div class="disks" id="disks"></div>
      </footer>

      <div class="scanlines" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
